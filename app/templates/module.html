<!DOCTYPE html>
<html>
<head>
    <title>{{ title }} - MediCore</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            color: #123b63;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: white;
            background: #1769aa;
            padding: 10px 18px;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #1769aa;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f7ff;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/dashboard" class="back">← Dashboard</a>

    <h1>🏥 {{ title }}</h1>

    {% if rows %}

    <table>

        <thead>
            <tr>
                {% for key in rows[0].keys() %}
                    <th>{{ key.replace('_', ' ').title() }}</th>
                {% endfor %}
            </tr>
        </thead>

        <tbody>

            {% for row in rows %}

            <tr>

                {% for value in row.values() %}

                    <td>
                        {{ value if value is not none else '-' }}
                    </td>

                {% endfor %}

            </tr>

            {% endfor %}

        </tbody>

    </table>

    {% else %}

    <div class="empty">
        <h3>No {{ title }} records found.</h3>
    </div>

    {% endif %}

</div>

</body>
</html>
